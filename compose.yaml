# Runs the dashboard on a home server, reachable only over Tailscale.
# Set TAILSCALE_IP in .env (e.g. TAILSCALE_IP=100.76.57.23) and put your resume PDF in data/.
# Data lives in the shared homelab Postgres database "projects" (tables intern_agent_*):
# set DATABASE_URL=postgresql://user:pass@postgres:5432/projects.
services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      RESUME_PATH: /app/data/resume.pdf
      DASHBOARD_ALLOWED_HOSTS: '["${TAILSCALE_IP}"]'
    volumes:
      - ./data:/app/data
    ports:
      - "${TAILSCALE_IP}:8765:8765"
    networks: [default, homelab]

networks:
  homelab:
    name: homelab_default
    external: true
