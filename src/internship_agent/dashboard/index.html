<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter 2027 Search</title>
<style>
  :root {
    --paper: #fafaf7; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6b66; --faint: #9a9a93;
    --line: #e7e6e1; --hover: #f2f1ec; --select: #ebeae3;
    --accent: #1f5135; --accent-ink: #ffffff; --accent-soft: #e4eee7;
    --hi: #1f5135; --mid: #8a6a12; --lo: #9a3b2f; --warn-bg: #fbf1dc; --warn: #7a5410;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121211; --panel: #1a1a19; --ink: #ecebe6; --muted: #a3a29b; --faint: #75746e;
      --line: #2b2b29; --hover: #222220; --select: #2a2a27;
      --accent: #7cc49a; --accent-ink: #0f1a13; --accent-soft: #1d2a22;
      --hi: #7cc49a; --mid: #e0bb5c; --lo: #ec8a7c; --warn-bg: #33291a; --warn: #e8c07a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
         font-feature-settings: "tnum" 1; }
  a { color: inherit; }
  button, input, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 210px minmax(0, 1fr) 440px; height: 100vh; }

  /* Sidebar */
  nav { border-right: 1px solid var(--line); padding: 22px 14px; overflow-y: auto; display: flex; flex-direction: column; }
  .brand { font-weight: 650; letter-spacing: -.01em; padding: 0 8px 18px; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .group { margin-bottom: 18px; }
  .group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
              font-weight: 600; margin: 0 0 4px; padding: 0 8px; }
  .nav-item { display: flex; justify-content: space-between; width: 100%; border: 0; background: none;
              padding: 5px 8px; border-radius: 6px; cursor: pointer; text-align: left; color: var(--muted); }
  .nav-item:hover { background: var(--hover); color: var(--ink); }
  .nav-item.on { background: var(--select); color: var(--ink); font-weight: 550; }
  .nav-item span:last-child { color: var(--faint); font-size: 12px; }
  .sender { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px 8px 0; border-top: 1px solid var(--line); }
  .sender b { color: var(--ink); font-weight: 550; word-break: break-all; }

  /* List */
  .list { display: flex; flex-direction: column; min-width: 0; }
  .list-head { display: flex; align-items: center; gap: 10px; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .list-head h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .list-head .count { color: var(--faint); }
  .spacer { flex: 1; }
  .search { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 9px; width: 190px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 11px;
         cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { border-color: var(--lo); color: var(--lo); }
  .btn:disabled { opacity: .5; cursor: default; }
  .rows { overflow-y: auto; flex: 1; }
  .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 160px 84px; gap: 14px; align-items: center;
         padding: 11px 22px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--select); }
  .row.done { color: var(--faint); }
  .fit { font-weight: 650; font-size: 15px; text-align: right; }
  .fit.strong { color: var(--hi); } .fit.possible { color: var(--mid); } .fit.weak { color: var(--lo); }
  .co { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.done .sub { color: var(--faint); }
  .who { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 12px; color: var(--muted); text-align: right; }
  .status.applied, .status.contacted { color: var(--hi); }
  .empty { padding: 48px 22px; color: var(--muted); }

  /* Detail */
  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #detail { flex: 1; overflow-y: auto; min-height: 0; }
  .chat { border-top: 1px solid var(--line); padding: 12px 16px 14px; background: var(--paper); }
  .chat-head { display: flex; justify-content: space-between; align-items: baseline; }
  .chat-head b { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
  .chat-head span { font-size: 12px; color: var(--muted); }
  .chat-log { max-height: 150px; overflow-y: auto; margin: 6px 0 8px; font-size: 13px; }
  .msg { margin: 6px 0; }
  .msg.me { color: var(--ink); }
  .msg.ai { color: var(--muted); }
  .msg.ai b { color: var(--hi); font-weight: 550; }
  .chat-row { display: flex; gap: 6px; align-items: flex-end; }
  .chat-row textarea { min-height: 40px; height: 40px; resize: none; background: var(--panel); }
  .note-list { list-style: none; padding: 0; margin: 6px 0 0; }
  .note-list li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .note-list time { color: var(--faint); font-size: 12px; margin-right: 6px; }
  .rule { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 22px; border-bottom: 1px solid var(--line); }
  .effect { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .effect.skip { color: var(--lo); } .effect.downrank { color: var(--mid); } .effect.boost { color: var(--hi); }
  .detail { padding: 22px 24px 40px; }
  .detail h2 { margin: 0; font-size: 20px; letter-spacing: -.015em; }
  .detail .lede { color: var(--muted); margin-top: 2px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  section h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
  .score-line { display: flex; align-items: baseline; gap: 8px; }
  .score-line .big { font-size: 26px; font-weight: 650; }
  ul.plain { margin: 6px 0 0; padding-left: 18px; }
  ul.plain li { margin: 3px 0; }
  .k { color: var(--faint); font-size: 12px; margin-top: 10px; }
  label.field { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input.text, textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 7px 9px; }
  textarea { resize: vertical; min-height: 180px; line-height: 1.5; }
  textarea.short { min-height: 80px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin-top: 10px; }
  .check input { margin-top: 3px; }
  .tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px; background: var(--warn-bg); color: var(--warn); margin-left: 6px; }
  .tag.ok { background: var(--accent-soft); color: var(--hi); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .counter { float: right; color: var(--faint); }
  .placeholder { padding: 48px 24px; color: var(--muted); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
           padding: 8px 14px; border-radius: 6px; font-size: 13px; display: none; z-index: 10; max-width: 90vw; }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 180px minmax(0, 1fr); }
    aside { position: fixed; inset: 0 0 0 auto; width: min(440px, 100vw); display: none; z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.12); }
    aside.open { display: block; }
    .close { display: inline-flex !important; }
  }
  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; height: auto; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; }
    .list-head, .row { padding-left: 16px; padding-right: 16px; }
    .row { grid-template-columns: 38px minmax(0, 1fr) 70px; }
    .row .who { display: none; }
    .search { width: 100%; }
  }
  .close { display: none; }
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <div class="list">
    <div class="list-head">
      <h1 id="view-title">Startups</h1><span class="count" id="view-count"></span>
      <span class="spacer"></span>
      <input class="search" id="q" type="search" placeholder="Filter">
      <button class="btn primary" id="find"></button>
    </div>
    <div class="rows" id="rows"></div>
  </div>
  <aside id="aside">
    <div id="detail"><div class="placeholder">Select a company to see details, drafts and actions.</div></div>
    <div class="chat">
      <div class="chat-head"><b>Notes</b><span id="chat-ctx">General</span></div>
      <div class="chat-log" id="chat-log"><div class="msg ai">Tell me why you're skipping something, what you liked, or what to avoid ("this one needs French"). I'll save it and learn from it.</div></div>
      <div class="chat-row">
        <textarea id="chat-in" placeholder="Add a note..." maxlength="2000"></textarea>
        <button class="btn primary" id="chat-send">Save</button>
      </div>
    </div>
  </aside>
</div>
<div id="toast"></div>
<script>
const DONE = new Set(["applied", "contacted", "skipped"]);
const VIEWS = {
  startups: { title: "Startups", group: "Startups", label: "All startups", test: l => isStartup(l) && !DONE.has(l.status), find: "startups" },
  early:    { title: "Early-stage startups", group: "Startups", label: "Early stage", test: l => l.segment === "early" && !DONE.has(l.status), find: "early" },
  mid:      { title: "Mid-stage startups", group: "Startups", label: "Mid stage", test: l => l.segment === "mid" && !DONE.has(l.status), find: "mid" },
  big:      { title: "Big companies", group: "Big companies", label: "Open postings", test: l => !isStartup(l) && !DONE.has(l.status), find: "postings" },
  applied:  { title: "Applied", group: "Pipeline", label: "Applied", test: l => l.status === "applied" },
  contacted:{ title: "Contacted", group: "Pipeline", label: "Contacted", test: l => l.status === "contacted" },
  skipped:  { title: "Skipped", group: "Pipeline", label: "Skipped", test: l => l.status === "skipped" },
  rules:    { title: "What I've learned", group: "Learned", label: "Your rules", test: () => false, find: "rescore" },
};
const FIND_LABEL = { startups: "Search for startups", early: "Search early-stage", mid: "Search mid-stage", postings: "Find more postings", rescore: "Re-check to-do leads" };
let state = { leads: [], view: "startups", q: "", selected: null, sender: null, armed: null, prefs: [] };

function isStartup(l) { return l.segment === "early" || l.segment === "mid"; }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); }
async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) } : {});
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}
async function load() {
  const data = await api("/api/leads");
  state.leads = data.leads; state.sender = data.sender; state.prefs = data.preferences;
  renderNav(); renderRows(); renderDetail();
}
function money(n) { return n ? "$" + (n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M" : Math.round(n / 1e3) + "K") : ""; }
function subtitle(l) {
  if (l.kind === "posting") return l.posting_title;
  return [l.round.replace("-", " "), money(l.amount_usd), l.announced_on && "raised " + l.announced_on].filter(Boolean).join(" · ");
}

function renderNav() {
  let html = `<div class="brand">Winter 2027<small>Internship search</small></div>`;
  let group = null;
  for (const [id, v] of Object.entries(VIEWS)) {
    if (v.group !== group) { if (group) html += `</div>`; html += `<div class="group"><h3>${v.group}</h3>`; group = v.group; }
    const n = id === "rules" ? state.prefs.length : state.leads.filter(v.test).length;
    html += `<button class="nav-item ${state.view === id ? "on" : ""}" data-view="${id}"><span>${v.label}</span><span>${n}</span></button>`;
  }
  html += `</div><div class="sender">${state.sender ? `Sending as <b>${esc(state.sender)}</b>` : "Email sending is off. Add GMAIL_ADDRESS and GMAIL_APP_PASSWORD to .env."}</div>`;
  $("nav").innerHTML = html;
}
function visible() {
  const v = VIEWS[state.view];
  return state.leads.filter(l => v.test(l) && (!state.q || `${l.company} ${l.posting_title} ${l.contact_name} ${l.what_they_build}`.toLowerCase().includes(state.q)));
}
function renderRules() {
  $("view-count").textContent = state.prefs.length;
  $("rows").innerHTML = state.prefs.length ? state.prefs.map(p => `
    <div class="rule">
      <div class="effect ${esc(p.effect)}">${esc(p.effect)}</div>
      <div><div class="co" style="white-space:normal">${esc(p.rule)}</div><div class="sub">From your note: "${esc(p.source_note)}"</div></div>
      <button class="btn" data-del-pref="${esc(p.id)}">Forget</button>
    </div>`).join("") : `<div class="empty">No rules yet. Add notes about companies (why you skipped one, what you want more of) and I'll learn from them.</div>`;
}
function renderRows() {
  const v = VIEWS[state.view];
  $("view-title").textContent = v.title;
  const find = $("find");
  find.style.display = v.find ? "" : "none";
  find.textContent = FIND_LABEL[v.find] || "";
  if (state.view === "rules") return renderRules();
  const items = visible();
  $("view-count").textContent = items.length;
  $("rows").innerHTML = items.length ? items.map(l => `
    <div class="row ${state.selected === l.key ? "on" : ""} ${DONE.has(l.status) ? "done" : ""}" data-key="${esc(l.key)}">
      <div class="fit ${l.fit ? l.fit.verdict : ""}">${l.fit ? l.fit.score : "–"}</div>
      <div><div class="co">${esc(l.company)}</div><div class="sub">${esc(subtitle(l))}</div></div>
      <div class="who">${esc(l.contact_name || (l.email ? l.email : "No contact yet"))}</div>
      <div class="status ${esc(l.status)}">${esc(l.sent_at ? "emailed" : l.status)}</div>
    </div>`).join("") : `<div class="empty">Nothing here yet.</div>`;
}

function linkedinUrl(l) {
  if (l.linkedin_url) return l.linkedin_url;
  const q = [l.contact_name || "", l.company].join(" ").trim();
  return "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(q);
}
function renderDetail() {
  const l = state.leads.find(x => x.key === state.selected);
  const aside = $("aside"), detail = $("detail");
  $("chat-ctx").textContent = l ? `About ${l.company}` : "General";
  if (!l) { aside.classList.remove("open"); detail.innerHTML = `<div class="placeholder">Select a company to see details, drafts and actions.</div>`; return; }
  aside.classList.add("open");
  const fit = l.fit, d = l.draft;
  const meta = [l.segment ? (l.segment === "big" ? "Big company" : l.segment + "-stage startup") : "Unclassified", l.location, l.kind === "founder" ? "Founder outreach" : "Posting"].filter(Boolean);
  const links = [
    l.posting_url && `<a href="${esc(l.posting_url)}" target="_blank" rel="noopener">Posting</a>`,
    l.company_url && `<a href="${esc(l.company_url)}" target="_blank" rel="noopener">Website</a>`,
    `<a href="${esc(l.source_url)}" target="_blank" rel="noopener">Source</a>`,
    l.x_url && `<a href="${esc(l.x_url)}" target="_blank" rel="noopener">X @${esc(l.x_handle)}</a>`,
    `<a href="${esc(linkedinUrl(l))}" target="_blank" rel="noopener">LinkedIn${l.linkedin_url ? "" : " search"}</a>`,
  ].filter(Boolean).join("");
  const list = (title, xs) => xs && xs.length ? `<div class="k">${title}</div><ul class="plain">${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const guessed = l.email && l.email_status === "pattern";
  const canSend = !!state.sender && !!d;
  const armed = state.armed === l.key;
  const emailSection = d ? `
    <section>
      <h4>Email</h4>
      ${l.sent_at ? `<div class="hint"><span class="tag ok">Sent</span> to ${esc(l.sent_to)} on ${esc(l.sent_at.slice(0, 10))}</div>` : ""}
      <label class="field">To ${guessed ? `<span class="tag" title="${esc(l.email_source)}">Unverified guess</span>` : l.email ? `<span class="tag ok">Published</span>` : ""}</label>
      <input class="text" id="f-to" value="${esc(l.email || "")}" placeholder="name@company.com">
      ${guessed ? `<label class="check"><input type="checkbox" id="f-verified"> I've checked this address is correct</label>` : ""}
      <label class="field">Subject</label>
      <input class="text" id="f-subject" value="${esc(d.email_subject)}">
      <label class="field">Message</label>
      <textarea id="f-body">${esc(d.email_body)}</textarea>
      <label class="check"><input type="checkbox" id="f-attach" checked> Attach resume (PDF)</label>
      <div class="actions">
        <button class="btn ${armed ? "danger" : "primary"}" id="send" ${canSend ? "" : "disabled"}>${armed ? "Click again to send" : l.sent_at ? "Send again" : "Send email"}</button>
        <button class="btn" data-copy="email">Copy</button>
      </div>
      ${state.sender ? "" : `<div class="hint">Sending is off until Gmail is set up in .env.</div>`}
    </section>
    <section>
      <h4>LinkedIn</h4>
      <label class="field">Connection note <span class="counter" id="li-count"></span></label>
      <textarea class="short" id="f-li" maxlength="300">${esc(d.linkedin_note || "")}</textarea>
      <div class="actions"><button class="btn" id="li-go">Copy note and open LinkedIn</button></div>
      <div class="hint">LinkedIn doesn't allow automated invitations. Paste the note and send it yourself.</div>
    </section>
    <section>
      <h4>X direct message</h4>
      <textarea class="short" id="f-dm">${esc(d.x_dm)}</textarea>
      <div class="actions"><button class="btn" id="dm-go">${l.x_url ? "Copy and open X profile" : "Copy"}</button></div>
    </section>` : `
    <section><h4>Outreach</h4><div class="hint">No draft yet.</div>
      <div class="actions"><button class="btn primary" data-draft="1">Write draft</button></div></section>`;
  const notes = (l.notes || []).slice().reverse();
  detail.innerHTML = `<div class="detail">
    <button class="btn close" id="close" style="float:right">Close</button>
    <h2>${esc(l.company)}</h2>
    <div class="lede">${esc(subtitle(l))}</div>
    <div class="meta">${meta.map(esc).map(m => `<span>${m}</span>`).join("")}</div>
    <div class="links">${links}</div>
    ${l.what_they_build ? `<p style="margin:12px 0 0">${esc(l.what_they_build)}</p>` : ""}
    ${l.contact_name || l.contact_role ? `<p style="margin:10px 0 0"><b>${esc(l.contact_name || "Contact")}</b>${l.contact_role ? ", " + esc(l.contact_role) : ""}</p>` : ""}
    <div class="actions">
      ${l.posting_url ? `<a class="btn primary" href="${esc(l.posting_url)}" target="_blank" rel="noopener">Open application</a>` : ""}
      ${l.kind === "posting" && l.status !== "applied" ? `<button class="btn" data-status="applied">Mark applied</button>` : ""}
      ${l.status !== "contacted" ? `<button class="btn" data-status="contacted">Mark contacted</button>` : ""}
      ${l.status !== "skipped" ? `<button class="btn" data-status="skipped">Skip</button>` : ""}
      ${DONE.has(l.status) ? `<button class="btn" data-status="scored">Move back to to-do</button>` : ""}
    </div>
    ${fit ? `<section><h4>Fit</h4>
      <div class="score-line"><span class="big fit ${fit.verdict}">${fit.score}</span><span class="sub">${esc(fit.verdict)} fit</span></div>
      ${list("Why", fit.reasons)}${list("Concerns", fit.concerns)}${list("Talking points", fit.talking_points)}
    </section>` : ""}
    ${notes.length ? `<section><h4>Your notes</h4><ul class="note-list">${notes.map(n => `<li><time>${esc(n.at.slice(0, 10))}</time>${esc(n.text)}</li>`).join("")}</ul></section>` : ""}
    ${emailSection}
    ${d ? `<div class="actions" style="margin-top:18px"><button class="btn" data-draft="1">Rewrite drafts</button></div>` : ""}
  </div>`;
  const li = $("f-li");
  if (li) { const upd = () => $("li-count").textContent = `${li.value.length}/300`; li.addEventListener("input", upd); upd(); }
}

$("nav").addEventListener("click", e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  state.view = b.dataset.view; renderNav(); renderRows();
});
$("q").addEventListener("input", e => { state.q = e.target.value.toLowerCase(); renderRows(); });
$("rows").addEventListener("click", async e => {
  const del = e.target.closest("[data-del-pref]");
  if (del) { await api("/api/preferences/delete", { id: del.dataset.delPref }); toast("Forgotten."); return load(); }
  const r = e.target.closest(".row"); if (!r) return;
  state.selected = r.dataset.key; state.armed = null; renderRows(); renderDetail();
});
$("find").addEventListener("click", async e => {
  const b = e.currentTarget, kind = VIEWS[state.view].find, label = b.textContent;
  b.disabled = true; b.textContent = "Searching…";
  try {
    if (kind === "rescore") {
      b.textContent = "Checking every to-do lead...";
      const r = await api("/api/rescore", {});
      toast(`Checked ${r.checked} leads. ${r.skipped.length ? "Skipped by your rules: " + r.skipped.map(x => x.company).join(", ") : "None broke a skip rule."}`);
    } else {
      const r = kind === "postings"
        ? await api("/api/find-more", { extra: 5 })
        : await api("/api/find-startups", { stages: kind === "startups" ? ["early", "mid"] : [kind], count: 5 });
      toast(r.added.length ? `Added ${r.added.length}: ${r.added.map(x => x.company).join(", ")}` : "Nothing new found this time.");
    }
    await load();
  } catch (err) { toast(err.message); }
  finally { b.disabled = false; b.textContent = label; }
});
$("detail").addEventListener("click", async e => {
  const l = state.leads.find(x => x.key === state.selected); if (!l) return;
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.id === "close") { state.selected = null; renderRows(); renderDetail(); }
    else if (b.dataset.status) {
      b.disabled = true;
      if (b.dataset.status === "applied") b.textContent = "Saving, finding more…";
      const r = await api("/api/status", { key: l.key, status: b.dataset.status });
      toast(r.added.length ? `Marked ${b.dataset.status}. Added ${r.added.length} new posting(s).` : `Marked ${b.dataset.status}.`);
      await load();
    } else if (b.dataset.draft) {
      b.disabled = true; b.textContent = "Writing…";
      await api("/api/draft", { key: l.key }); toast("Drafts ready."); await load();
    } else if (b.dataset.copy) {
      await navigator.clipboard.writeText(`Subject: ${$("f-subject").value}\n\n${$("f-body").value}`); toast("Copied.");
    } else if (b.id === "li-go") {
      await navigator.clipboard.writeText($("f-li").value); window.open(linkedinUrl(l), "_blank", "noopener"); toast("Note copied. Paste it into the invitation.");
    } else if (b.id === "dm-go") {
      await navigator.clipboard.writeText($("f-dm").value); if (l.x_url) window.open(l.x_url, "_blank", "noopener"); toast("Message copied.");
    } else if (b.id === "send") {
      if (state.armed !== l.key) {
        state.armed = l.key; b.textContent = "Click again to send"; b.classList.replace("primary", "danger");
        setTimeout(() => { if (state.armed === l.key) { state.armed = null; b.textContent = "Send email"; b.classList.replace("danger", "primary"); } }, 5000);
        return;
      }
      state.armed = null; b.disabled = true; b.textContent = "Sending…";
      const verified = $("f-verified");
      await api("/api/send", {
        key: l.key, to: $("f-to").value, subject: $("f-subject").value, body: $("f-body").value,
        attach_resume: $("f-attach").checked, confirm_unverified: verified ? verified.checked : false, resend: !!l.sent_at,
      });
      toast(`Sent to ${$("f-to").value}.`); await load();
    }
  } catch (err) { toast(err.message); await load().catch(() => {}); }
});
function chatLine(cls, html) {
  const log = $("chat-log"); const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight;
}
async function sendNote() {
  const box = $("chat-in"), text = box.value.trim(); if (!text) return;
  const btn = $("chat-send"); btn.disabled = true; box.value = "";
  const lead = state.leads.find(x => x.key === state.selected);
  chatLine("me", (lead ? `<b>${esc(lead.company)}:</b> ` : "") + esc(text));
  try {
    const r = await api("/api/note", { message: text, key: lead ? lead.key : null });
    let extra = "";
    if (r.status_changed) extra += ` Marked ${esc(r.status_changed)}.`;
    if (r.learned.length) extra += ` <b>Learned:</b> ${r.learned.map(p => esc(p.rule)).join("; ")}.`;
    chatLine("ai", esc(r.reply) + extra);
    await load();
  } catch (err) { chatLine("ai", "Couldn't save that: " + esc(err.message)); box.value = text; }
  finally { btn.disabled = false; box.focus(); }
}
$("chat-send").addEventListener("click", sendNote);
$("chat-in").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendNote(); } });
load().catch(err => $("rows").innerHTML = `<div class="empty">Could not load: ${esc(err.message)}</div>`);
</script>
</body>
</html>
