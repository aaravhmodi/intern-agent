[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internship-agent"
version = "0.1.0"
description = "Local-first agent for tracking Winter 2027 software-engineering internships."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.12,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
internship-agent = "internship_agent.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/internship_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
